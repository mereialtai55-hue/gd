<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Geometry Dash</title>
    <style>
        body {
            margin: 0;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            background-color: #222;
            border: 3px solid #fff;
        }
        #score {
            position: absolute;
            top: 10px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div id="score">Ұпай: 0</div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = {
            x: 50,
            y: 300,
            width: 30,
            height: 30,
            color: 'red',
            dy: 0,
            gravity: 0.8,
            jump: -12,
            grounded: false
        };

        let obstacles = [];
        let obstacleSpeed = 5;
        let spawnTimer = 0;
        let score = 0;

        function spawnObstacle() {
            let height = Math.random() * 50 + 20;
            obstacles.push({
                x: canvas.width,
                y: canvas.height - height,
                width: 20,
                height: height,
                color: 'green'
            });
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Player physics
            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
                player.dy = 0;
                player.grounded = true;
            } else {
                player.grounded = false;
            }

            // Draw player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Obstacles
            spawnTimer++;
            if (spawnTimer > 90) { // әр 1.5 секунд сайын жаңа кедергі
                spawnObstacle();
                spawnTimer = 0;
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= obstacleSpeed;
                ctx.fillStyle = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                // Collision detection
                if (player.x < obs.x + obs.width &&
                    player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height &&
                    player.y + player.height > obs.y) {
                        alert('Ойын аяқталды! Ұпай: ' + score);
                        document.location.reload();
                }

                if (obs.x + obs.width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    document.getElementById('score').innerText = "Ұпай: " + score;
                }
            }

            requestAnimationFrame(update);
        }

        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (player.grounded) {
                    player.dy = player.jump;
                }
            }
        });

        update();
    </script>
</body>
</html>
